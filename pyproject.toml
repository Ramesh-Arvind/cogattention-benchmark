[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogattention"
version = "1.0.0"
description = "CogAttention: Cognitive Attention Benchmark for LLMs — 15 task types across 5 attention abilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ramesh Arvind Naagarajan"},
]
keywords = ["benchmark", "attention", "llm", "cognitive-science", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "plotly>=5.0"]
eval = ["torch>=2.0", "vllm>=0.4", "transformers>=4.30"]
vision = ["Pillow>=9.0"]
all = ["cogattention[viz,eval,vision]"]
dev = ["pytest>=7.0", "cogattention[all]"]

[project.urls]
Repository = "https://github.com/Ramesh-Arvind/cogattention-benchmark"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
